<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="product-card">
            <img src="product1.png" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>

        <div class="product-card">
            <img src="product3.png" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="product-card">
            <img src="product2.png" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹2,500</p>
        </div>

        <div class="product-card">
            <img src="smartwatch.jpeg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>₹4,000</p>
        </div>

        <div class="product-card">
            <img src="keyboard.jpeg" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="product-card">
            <img src="mouse.jpeg" alt="Mouse">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="product-card">
            <img src="tablet.jpeg" alt="Tablet">
            <h2>Tablet</h2>
            <p>₹18,000</p>
        </div>

        <div class="product-card">
            <img src="camera.jpeg" alt="Camera">
            <h2>Camera</h2>
            <p>₹45,000</p>
        </div>

    </div>

</body>
</html>
