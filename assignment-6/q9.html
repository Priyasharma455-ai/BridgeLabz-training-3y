<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <div class="card-front">
                <h2>Front Side</h2>
                <p>Hover over the card</p>
            </div>

            <div class="card-back">
                <h2>Back Side</h2>
                <p>Welcome to my card!</p>
            </div>

        </div>

    </div>

</body>
</html>
