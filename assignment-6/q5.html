<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card popular">
            <h2>Standard</h2>
            <p class="price">₹999</p>
            <p>5 Users</p>
            <p>25 GB Storage</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <p class="price">₹1499</p>
            <p>10 Users</p>
            <p>50 GB Storage</p>
            <p>24/7 Support</p>
            <button>Choose Plan</button>
        </div>

    </main>

</body>
</html>
