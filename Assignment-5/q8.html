<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <!-- Dashboard Header -->
    <header class="dashboard-header">
        <h1>My Dashboard</h1>
        <p>Welcome back, Priya!</p>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Projects</a>
                <a href="#">Tasks</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Overview</h2>

            <section class="cards">

                <article class="card">
                    <h3>Total Projects</h3>
                    <p>12</p>
                </article>

                <article class="card">
                    <h3>Completed Tasks</h3>
                    <p>48</p>
                </article>

                <article class="card">
                    <h3>Pending Tasks</h3>
                    <p>8</p>
                </article>

                <article class="card">
                    <h3>Team Members</h3>
                    <p>6</p>
                </article>

            </section>

            <section class="recent">
                <h2>Recent Activity</h2>
                <p>You completed the Dashboard Layout project.</p>
                <p>A new task was added to your project.</p>
            </section>

        </main>

    </div>

</body>

</html>
