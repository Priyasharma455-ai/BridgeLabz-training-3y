<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Responsive Image Gallery</p>
    </header>

    <main class="gallery">

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=1"
                 alt="Nature Image">
            <div class="overlay"></div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=2"
                 alt="Mountain Image">
            <div class="overlay"></div>
            <figcaption>Mountains</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=3"
                 alt="Ocean Image">
            <div class="overlay"></div>
            <figcaption>Ocean</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=4"
                 alt="Forest Image">
            <div class="overlay"></div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=5"
                 alt="Travel Image">
            <div class="overlay"></div>
            <figcaption>Travel</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://picsum.photos/400/300?random=6"
                 alt="City Image">
            <div class="overlay"></div>
            <figcaption>City</figcaption>
        </figure>

    </main>

    <footer>
        <p>© 2026 Image Showcase Practice</p>
    </footer>

</body>
</html>
