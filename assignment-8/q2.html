<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Tooltip Demonstration</h1>
    </header>

    <main class="container">

        <!-- Tooltip 1 -->
        <div class="tooltip">
            <span>HTML</span>
            <div class="tooltip-text">
                HTML creates the structure of a webpage.
            </div>
        </div>

        <!-- Tooltip 2 -->
        <div class="tooltip">
            <span>CSS</span>
            <div class="tooltip-text">
                CSS is used to style webpages.
            </div>
        </div>

        <!-- Tooltip 3 -->
        <div class="tooltip">
            <span>JavaScript</span>
            <div class="tooltip-text">
                JavaScript adds interactivity to webpages.
            </div>
        </div>

        <!-- Tooltip 4 -->
        <div class="tooltip">
            <span>Web Development</span>
            <div class="tooltip-text">
                Web development is used to build websites.
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Tooltip Practice</p>
    </footer>

</body>
</html>
