<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>

    <header>
        <h1>User Interface Components</h1>
        <p>Simple and Responsive UI Design</p>
    </header>

    <main class="container">

        <section class="card">

            <h2>Search and Explore</h2>

            <div class="search-box">
                <input type="text" placeholder="Search here...">
                <button>Search</button>
            </div>

            <div class="options">

                <button class="action-btn">Get Started</button>

                <select>
                    <option value="">Select a Category</option>
                    <option value="web">Web Development</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="cyber">Cybersecurity</option>
                </select>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 UI Components Practice</p>
    </footer>

</body>
</html>
