<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header>
        <h1>My Mini User Interface</h1>
        <p>Simple Responsive Web Layout</p>
    </header>

    <main class="container">

        <section class="card">

            <div class="image-section">
                <img src="https://picsum.photos/250/180" alt="Web Development Image">
            </div>

            <div class="content-section">

                <h2>Get Started</h2>

                <p>
                    Fill in the form below to explore
                    web development and start learning.
                </p>

                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <div class="buttons">

                        <button type="submit" class="submit-btn">
                            Submit
                        </button>

                        <button type="reset" class="reset-btn">
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Mini UI Practice</p>
    </footer>

</body>
</html>
