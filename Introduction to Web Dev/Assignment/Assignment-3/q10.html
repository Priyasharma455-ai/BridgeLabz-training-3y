<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Selection</title>
</head>

<body>

    <h1>Travel Location Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option>New Delhi</option>
        <option>Mumbai</option>
        <option>Jaipur</option>
    </select>

    <br><br>

    <label for="tourist-place">Favorite Tourist Place:</label>
    <select id="tourist-place">
        <option>India Gate</option>
        <option>Gateway of India</option>
        <option>Hawa Mahal</option>
    </select>

    <p>
        My selected choices are India, Delhi, New Delhi, and India Gate
        as my favorite tourist place.
    </p>

</body>

</html>
