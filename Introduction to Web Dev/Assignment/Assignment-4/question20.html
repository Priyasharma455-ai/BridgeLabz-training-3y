<!DOCTYPE html>
<html lang="en">

<head>

    <!-- title: Defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- meta charset: Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- meta description: Provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- meta author: Specifies the author of the webpage -->
    <meta name="author" content="Priya Sharma">

    <!-- base: Defines the base URL for relative links -->
    <base href="./">

    <!-- link: Used to link external resources such as favicon -->
    <link rel="icon" href="data:,">

    <!-- style: Contains CSS styling for the webpage -->
    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>

    <!-- script: Used to add JavaScript to a webpage -->
    <script>
        // JavaScript can be written here.
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>This page demonstrates important elements used inside the head section.</p>

</body>

</html>
