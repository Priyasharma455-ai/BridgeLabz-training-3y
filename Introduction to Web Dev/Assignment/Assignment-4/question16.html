<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Example</h1>

    <p>Original URL:</p>
    <p>https://example.com/search?query=HTML & CSS</p>

    <p>Encoded URL:</p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        https://example.com/search?query=HTML%20%26%20CSS
    </a>

</body>
</html>
