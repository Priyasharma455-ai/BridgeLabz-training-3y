<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>
<body>

    <h1>My City - Mathura</h1>

    <!-- loading="lazy" loads the map only when it is needed or near the visible area -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,India&output=embed"
        title="Google Map of Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
