<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" target="resultFrame" method="get">

        <label for="name">Enter Text:</label>
        <input type="text" id="name" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe name="resultFrame" width="500" height="150">
    </iframe>

</body>
</html>
