<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Multiple inline formatting elements -->
    <p>
        I am <b>Priya Sharma</b>, a
        <strong>Computer Science student</strong>
        who loves <i>coding</i>, enjoys
        <em>learning</em>, and is interested in
        <mark>cybersecurity</mark>.
    </p>

</body>
</html>
