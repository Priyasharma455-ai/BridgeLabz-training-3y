<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q5 - Movie Ticket Booking</title>
<style>body{font-family:Arial;max-width:520px;margin:30px auto;padding:20px}label{display:block;margin-top:12px}input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}button{margin-top:16px}#message{white-space:pre-wrap}</style></head>
<body><h1>Movie Ticket Booking</h1><form id="bookingForm" novalidate>
<label for="name">Name</label><input id="name" type="text">
<label for="email">Email</label><input id="email" type="text">
<label for="seats">Seats (1 to 10)</label><input id="seats" type="number" min="1" max="10">
<button type="submit">Book Tickets</button></form><p id="message" aria-live="polite"></p><script src="Q5.js"></script></body></html>
