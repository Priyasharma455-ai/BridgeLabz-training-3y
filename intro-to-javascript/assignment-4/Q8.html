<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q8 - Dynamic Object Updater</title>
<style>body{font-family:Arial;max-width:520px;margin:30px auto;padding:20px}label{display:block;margin-top:12px}input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}button{margin-top:16px}pre{background:#f4f4f4;padding:12px}</style></head>
<body><h1>Edit User Details</h1><form id="userForm">
<label for="name">Name</label><input id="name" type="text" required>
<label for="email">Email</label><input id="email" type="email" required>
<label for="age">Age</label><input id="age" type="number" min="1" required>
<button type="submit">Update User</button></form><h2>Updated User Object</h2><pre id="output"></pre><script src="Q8.js"></script></body></html>
