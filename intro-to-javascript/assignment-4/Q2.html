<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 - Student Form Validator</title>
<style>
body{font-family:Arial;max-width:520px;margin:30px auto;padding:20px}
label{display:block;margin-top:12px} input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px;border:2px solid #aaa}
.valid{border-color:green}.invalid{border-color:red}.error{color:red;min-height:18px;font-size:14px}
</style>
</head>
<body>
<h1>Student Registration</h1>
<form id="studentForm" novalidate>
<label for="name">Name</label><input id="name" type="text"><div class="error" id="nameError"></div>
<label for="email">Email</label><input id="email" type="text"><div class="error" id="emailError"></div>
<label for="phone">Phone</label><input id="phone" type="text" inputmode="numeric"><div class="error" id="phoneError"></div>
<label for="password">Password</label><input id="password" type="password"><div class="error" id="passwordError"></div>
<button type="submit">Register</button>
</form><p id="result" aria-live="polite"></p>
<script src="Q2.js"></script>
</body></html>
