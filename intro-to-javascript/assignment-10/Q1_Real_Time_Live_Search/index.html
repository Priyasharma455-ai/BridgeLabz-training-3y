<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Real-Time Live Search</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Real-Time Product Search</h1>
    <p>Type a product name to search.</p>
    <input id="searchInput" type="search" placeholder="Search products..." autocomplete="off">
    <p id="loading" class="info" hidden>Loading products...</p>
    <section id="results" class="product-grid"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
