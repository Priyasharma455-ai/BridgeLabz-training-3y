<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Multi-API Dashboard</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container">
    <h1>Multi-API Dashboard</h1>
    <p id="loading" class="info">Loading dashboard...</p>
    <p id="warning" class="error" hidden>Some data could not be loaded.</p>
    <section class="stats">
      <article class="stat-card"><h2>Total Users</h2><p id="usersCount">---</p></article>
      <article class="stat-card"><h2>Total Orders</h2><p id="ordersCount">---</p></article>
      <article class="stat-card"><h2>Total Products</h2><p id="productsCount">---</p></article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
