<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>body{font:16px Arial;max-width:500px;margin:40px auto;padding:0 16px}label{display:block;margin:14px 0}input{display:block;width:95%;padding:10px;margin-top:5px;box-sizing:border-box}.error{color:#c00;min-height:1em}.success{color:green;font-weight:bold}button{padding:10px}</style><h1>Form Submit Blocker</h1><form id="form" novalidate><label>Name<input id="name"></label><p id="name-error" class="error"></p><label>Email<input id="email" type="email"></label><p id="email-error" class="error"></p><label>Password<input id="password" type="password"></label><p id="password-error" class="error"></p><button>Submit</button></form><p id="success" class="success" aria-live="polite"></p><script src="FormSubmitBlockerLiveErrors.js"></script></html>
