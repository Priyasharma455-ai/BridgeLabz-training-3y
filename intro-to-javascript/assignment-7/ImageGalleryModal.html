<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Gallery</title><style>body{font:16px Arial;margin:30px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:720px}.gallery img{width:100%;height:140px;object-fit:cover;cursor:pointer}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}.content{position:relative;background:white;padding:12px}.content img{max-width:85vw;max-height:80vh}.close{position:absolute;right:5px;top:5px}</style><h1>Image Gallery</h1><div class="gallery" id="gallery"><img src="https://picsum.photos/id/10/400/300" data-large="https://picsum.photos/id/10/1200/900" alt="Forest"><img src="https://picsum.photos/id/20/400/300" data-large="https://picsum.photos/id/20/1200/900" alt="Camera"><img src="https://picsum.photos/id/30/400/300" data-large="https://picsum.photos/id/30/1200/900" alt="Mountains"><img src="https://picsum.photos/id/40/400/300" data-large="https://picsum.photos/id/40/1200/900" alt="Coast"><img src="https://picsum.photos/id/50/400/300" data-large="https://picsum.photos/id/50/1200/900" alt="Nature"><img src="https://picsum.photos/id/60/400/300" data-large="https://picsum.photos/id/60/1200/900" alt="Travel"></div><div id="modal" class="modal" hidden><div id="content" class="content"><button id="close" class="close">Close</button><img id="large" alt="Enlarged preview"></div></div><script src="ImageGalleryModal.js"></script></html>
