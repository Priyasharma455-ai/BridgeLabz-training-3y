<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Dropdown</title><style>body{font:16px Arial;margin:40px}.dropdown{position:relative;display:inline-block;width:240px}.toggle{width:100%;padding:12px;text-align:left}.options{position:absolute;top:100%;left:0;right:0;border:1px solid #aaa;background:white}.options[hidden]{display:none}.option{display:block;width:100%;padding:10px;text-align:left;border:0;background:white;cursor:pointer}</style><h1>Custom Dropdown</h1><p>Built with JavaScript buttons, not a select element.</p><div id="dropdown" class="dropdown"><button id="toggle" class="toggle" aria-expanded="false">Choose a branch ▾</button><div id="options" class="options" hidden><button class="option">Computer Science</button><button class="option">Electronics</button><button class="option">Mechanical</button><button class="option">Information Technology</button></div></div><script src="CustomDropdownJavaScript.js"></script></html>
