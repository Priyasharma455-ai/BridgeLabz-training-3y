<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Step Form</title><style>body{font:16px Arial;max-width:500px;margin:40px auto;padding:0 16px}label{display:block;margin:14px 0}input{display:block;padding:9px;width:95%;margin-top:5px}button{padding:9px;margin:8px 4px 0 0}</style><h1>Multi-Step Form</h1><form id="form"><section class="step"><h2>Step 1: Name</h2><label>Name<input id="name" required></label></section><section class="step" hidden><h2>Step 2: Email</h2><label>Email<input id="email" type="email" required></label></section><section class="step" hidden><h2>Step 3: Password</h2><label>Password<input id="password" type="password" minlength="6" required></label></section><button type="button" id="back">Back</button><button type="button" id="next">Next</button><button id="finish" hidden>Finish</button></form><div id="summary"></div><script src="MultiStepFormValidation.js"></script></html>
