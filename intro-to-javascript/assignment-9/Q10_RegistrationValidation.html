<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form Validation</title>
<link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="Q10_RegistrationValidation.js" defer></script>
</head>
<body>
<main><h1>Registration Form</h1><form id="registrationForm" novalidate><label>Name <input id="name"></label><small id="nameError" class="error"></small><label>Email <input id="email" type="email"></label><small id="emailError" class="error"></small><label>Password <input id="password" type="password"></label><small id="passwordError" class="error"></small><button type="submit">Register</button></form><p id="successMessage" aria-live="polite"></p></main>
</body>
</html>
