<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="container">

        <div class="box box-one">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box box-two">
            <h2>Box 2</h2>
            <p>Width: 30%</p>
            <p>Height: 20vh</p>
        </div>

        <div class="box box-three">
            <h2>Box 3</h2>
            <p>Width: 12em</p>
            <p>Height: 250px</p>
        </div>

    </main>

    <footer>
        <p>© 2026 Height and Width Practice</p>
    </footer>

</body>
</html>
