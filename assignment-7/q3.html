<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>Gradient Background Page</h1>
    </header>

    <main>

        <section class="linear-section">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient background.
                    The colors change gradually in a straight direction.
                </p>
            </div>
        </section>

        <section class="radial-section">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient background.
                    The colors spread outward from a central point.
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Gradient Background Page</p>
    </footer>

</body>
</html>
