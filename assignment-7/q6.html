<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main class="transform-container">

        <div class="transform-item">
            <div class="transform-box rotate">
                Rotate
            </div>
            <p>rotate()</p>
        </div>

        <div class="transform-item">
            <div class="transform-box scale">
                Scale
            </div>
            <p>scale()</p>
        </div>

        <div class="transform-item">
            <div class="transform-box translate">
                Translate
            </div>
            <p>translate()</p>
        </div>

        <div class="transform-item">
            <div class="transform-box skew">
                Skew
            </div>
            <p>skew()</p>
        </div>

    </main>

    <footer>
        <p>© 2026 CSS Transformations</p>
    </footer>

</body>
</html>
