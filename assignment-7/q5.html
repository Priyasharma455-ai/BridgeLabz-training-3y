<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main class="container">

        <section class="selector-box">

            <h2>Attribute Selectors</h2>

            <input type="text" placeholder="Text input">

            <p>
                <a href="https://www.google.com">Secure HTTPS Link</a>
            </p>

            <p>
                <a href="http://example.com">Normal HTTP Link</a>
            </p>


            <h2>List Items</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>Python</li>
            </ul>


            <h2>Combinators</h2>

            <div class="parent">

                <p class="child">Direct Child Paragraph</p>

                <div>
                    <p>Nested Paragraph</p>
                </div>

                <p class="adjacent">Adjacent Paragraph</p>

                <p>General Sibling Paragraph</p>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Advanced CSS Selectors</p>
    </footer>

</body>
</html>
