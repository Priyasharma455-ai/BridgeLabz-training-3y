<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>

<body>

    <main>
        <section class="comparison">

            <h1>Filter Comparison</h1>

            <div class="images">

                <figure class="image-box">
                    <img src="comparison1.jpg" alt="Original landscape image">
                    <figcaption>Original Image</figcaption>
                </figure>

                <figure class="image-box filtered">
                    <img src="comparison2.jpg" alt="Filtered landscape image">
                    <figcaption>Filtered Image</figcaption>
                </figure>

            </div>

        </section>
    </main>

</body>

</html>
