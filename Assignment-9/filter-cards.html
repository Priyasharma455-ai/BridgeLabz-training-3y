<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>

    <link rel="stylesheet" href="filter-cards.css">
</head>

<body>

    <main>
        <section class="team-section">

            <h1>Our Team</h1>

            <div class="cards">

                <article class="card">
                    <img src="person1.jpg" alt="Profile of Priya">
                    <div class="card-content">
                        <h2>Priya</h2>
                        <p>Full Stack Developer</p>
                    </div>
                </article>

                <article class="card">
                    <img src="person2.png" alt="Profile of Rahul">
                    <div class="card-content">
                        <h2>Rahul</h2>
                        <p>Web Developer</p>
                    </div>
                </article>

                <article class="card">
                    <img src="person3.png" alt="Profile of Ananya">
                    <div class="card-content">
                        <h2>Ananya</h2>
                        <p>UI/UX Designer</p>
                    </div>
                </article>

            </div>

        </section>
    </main>

</body>

</html>
