<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Cards</title>

    <link rel="stylesheet" href="responsive-cards.css">
</head>

<body>

    <!-- Main Content -->
    <main>

        <section class="cards">

            <!-- Card 1 -->
            <article class="card">
                <h2>HTML</h2>
                <p>
                    HTML is used to create the structure
                    of a webpage.
                </p>
            </article>

            <!-- Card 2 -->
            <article class="card">
                <h2>CSS</h2>
                <p>
                    CSS is used to style and design
                    webpages.
                </p>
            </article>

            <!-- Card 3 -->
            <article class="card">
                <h2>JavaScript</h2>
                <p>
                    JavaScript is used to add functionality
                    to webpages.
                </p>
            </article>

            <!-- Card 4 -->
            <article class="card">
                <h2>Responsive Design</h2>
                <p>
                    Responsive design makes websites
                    adaptable to different screen sizes.
                </p>
            </article>

        </section>

    </main>

</body>

</html>
