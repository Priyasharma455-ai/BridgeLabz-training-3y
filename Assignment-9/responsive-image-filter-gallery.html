<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <!-- Main Content -->
    <main>

        <section class="gallery">

            <!-- Image 1 - Blur -->
            <figure class="gallery-card">
                <img
                    class="blur"
                    src="https://picsum.photos/id/1015/500/350"
                    alt="Mountain landscape">
                <figcaption>Blur Effect</figcaption>
            </figure>

            <!-- Image 2 - Grayscale -->
            <figure class="gallery-card">
                <img
                    class="grayscale"
                    src="https://picsum.photos/id/1016/500/350"
                    alt="Nature landscape">
                <figcaption>Grayscale Effect</figcaption>
            </figure>

            <!-- Image 3 - Sepia -->
            <figure class="gallery-card">
                <img
                    class="sepia"
                    src="https://picsum.photos/id/1025/500/350"
                    alt="Dog">
                <figcaption>Sepia Effect</figcaption>
            </figure>

            <!-- Image 4 - Brightness -->
            <figure class="gallery-card">
                <img
                    class="brightness"
                    src="https://picsum.photos/id/1035/500/350"
                    alt="Road">
                <figcaption>Brightness Effect</figcaption>
            </figure>

            <!-- Image 5 - Contrast -->
            <figure class="gallery-card">
                <img
                    class="contrast"
                    src="https://picsum.photos/id/1043/500/350"
                    alt="Forest">
                <figcaption>Contrast Effect</figcaption>
            </figure>

            <!-- Image 6 - Hue Rotate -->
            <figure class="gallery-card">
                <img
                    class="hue-rotate"
                    src="https://picsum.photos/id/1050/500/350"
                    alt="Water landscape">
                <figcaption>Hue-Rotate Effect</figcaption>
            </figure>

        </section>

    </main>

</body>

</html>
